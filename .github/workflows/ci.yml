name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Tier 1 — pure logic (blocklist, patch_file, path guards, truncation).
  # No Docker, no ROS: runs anywhere, fast, gates every push/PR.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Unit tests (node:test)
        run: npm test

  # Tier 2 — sandbox security guarantees against REAL Docker containers
  # (ubuntu:24.04 only). GitHub-hosted ubuntu runners ship with Docker, so this
  # runs on every push. Covers: path-traversal / symlink escape refusal,
  # workbench isolation (host files / docker socket not reachable), and the
  # pids / memory / cpu caps actually biting under a bomb.
  sandbox:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Sandbox adversarial tests (Docker)
        run: npm run test:sandbox

  # Tier 3 — the ROS lane (live turtlesim, colcon, multi-distro builds) needs a
  # real ROS 2 install and a display; GitHub-hosted runners have neither. This
  # job is a PLACEHOLDER that only runs on a self-hosted runner labelled `ros`.
  # Until such a runner exists it is skipped by default. Run `npm run test:ros`
  # manually on a ROS machine in the meantime (see test-ros.sh).
  ros:
    if: false # flip to a self-hosted runner when available; ROS can't run on hosted
    runs-on: [self-hosted, ros]
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - name: ROS lane tests (requires sourced ROS 2 + turtlesim)
        run: npm run test:ros
