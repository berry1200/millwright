name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tier 1 - pure logic (blocklist, patch_file, path guards, truncation).
  # No Docker, no ROS: runs anywhere, fast, gates every push/PR.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Unit tests (node:test)
        run: npm test

  # Tier 2 - sandbox security guarantees against REAL Docker containers
  # (ubuntu:24.04 only). GitHub-hosted ubuntu runners ship with Docker, so this
  # runs on every push. Covers: path-traversal / symlink escape refusal,
  # workbench isolation (host files / docker socket not reachable), and the
  # pids / memory / cpu caps actually biting under a bomb.
  sandbox:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Sandbox adversarial tests (Docker)
        run: npm run test:sandbox

# ---------------------------------------------------------------------------
# Tier 3 - the ROS lane (live turtlesim, colcon, multi-distro builds) needs a
# real ROS 2 install and a display; GitHub-hosted runners have neither, so
# there is deliberately NO ros job here. A job that can never be scheduled adds
# validation surface for zero benefit (an earlier `if: false` +
# `runs-on: [self-hosted, ros]` stub is a suspect for a workflow startup
# failure). Run `npm run test:ros` manually on a ROS machine (see test-ros.sh).
#
# To enable it once a self-hosted runner labelled `ros` exists, uncomment and
# add under `jobs:` (note the two-space indent):
#
#   ros:
#     runs-on: [self-hosted, ros]
#     needs: unit
#     steps:
#       - uses: actions/checkout@v4
#       - uses: actions/setup-node@v4
#         with:
#           node-version: "20"
#       - run: npm ci
#       - name: ROS lane tests (requires sourced ROS 2 + turtlesim)
#         run: npm run test:ros
# ---------------------------------------------------------------------------
